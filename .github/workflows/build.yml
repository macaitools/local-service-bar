name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project LocalServiceBar.xcodeproj -target LocalServiceBar -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SYMROOT="$PWD/build" build

      - name: Verify and package
        run: |
          APP=build/Release/LocalServiceBar.app
          codesign --verify --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/LocalServiceBar"
          plutil -p "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" LocalServiceBar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LocalServiceBar
          path: LocalServiceBar.zip

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest LocalServiceBar.zip \
            --target "$GITHUB_SHA" \
            --title "最新构建 ${GITHUB_SHA::7}" \
            --notes "由 main 分支 ${GITHUB_SHA::7} 自动构建，支持 Apple Silicon 与 Intel，ad-hoc 签名、未经公证。首次打开前执行：\`xattr -dr com.apple.quarantine /Applications/LocalServiceBar.app\`"
